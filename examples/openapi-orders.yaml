openapi: 3.0.0
info:
  title: Proprietary Inventory & Orders API
  version: 1.0.0
  description: Example custom REST API with authentication and OpenAPI documentation.
servers:
  - url: https://api.internal-corp.test/v1
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List recent orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, completed, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: A list of orders
    post:
      operationId: createOrder
      summary: Create a new customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items]
              properties:
                customerId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku:
                        type: string
                      quantity:
                        type: integer
      responses:
        "201":
          description: Order created successfully
  /orders/{orderId}:
    get:
      operationId: getOrderById
      summary: Retrieve order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
